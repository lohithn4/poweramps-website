name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild (02:00 IST) so newly approved testimonials appear on the website.
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Detect Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Ask Bing & co. (IndexNow) to recrawl after content changes. Google has no such API:
      # use Search Console > URL inspection > Request indexing for Google.
      - uses: actions/checkout@v7
        if: github.event_name != 'schedule'
        with:
          sparse-checkout: |
            public
            scripts
      - name: Ping IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ steps.deployment.outputs.page_url }}"
