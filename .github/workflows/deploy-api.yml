name: Deploy API (Cloudflare Worker)

# Deploys worker/ to Cloudflare when it changes. Requires the repository secret
# CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID). Skips cleanly until they exist.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping API deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
